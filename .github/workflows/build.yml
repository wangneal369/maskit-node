name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  package:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: build-w
            artifact: windows-x64
            files: out/*.exe
          - os: macos-latest
            script: build-m-arm64
            artifact: macos-arm64
            files: |
              out/*.dmg
              out/*.zip
          - os: ubuntu-latest
            script: build-l
            artifact: linux-x64
            files: out/*.deb
    runs-on: ${{ matrix.os }}
    env:
      # 未配置签名证书：关闭 macOS 自动查找签名身份，产物为未签名包
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: frontend
      - name: Build frontend + main process
        run: npm run build
      - name: Package installer
        run: npm run ${{ matrix.script }}
      - uses: actions/upload-artifact@v7
        with:
          name: DataMaskit-${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Zip browser extension
        run: |
          cd extension
          zip -r "../dist/DataMaskit-extension-${GITHUB_REF_NAME}.zip" .
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
