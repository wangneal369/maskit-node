name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  # onnxruntime-node 的 install 脚本在 linux/x64 上会额外下载 CUDA/TensorRT 执行器（数百 MB）；
  # NER 只用 CPU 执行器（CPU 库随 npm 包自带），跳过下载可显著缩小 deb 体积并加快 npm ci
  ONNXRUNTIME_NODE_INSTALL: skip

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  package:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: build-w
            artifact: windows-x64
            files: |
              out/*.exe
              out/*.exe.blockmap
              out/latest.yml
          # Windows arm64：在 x64 的 windows-latest 上交叉打包 NSIS（无需运行 ARM 二进制）。
          # 更新通道 arm64（arm64.yml）：打进包内 app-update.yml，arm64 用户只会取 arm64.yml，不会被更新成 x64 安装包
          - os: windows-latest
            script: build-w-arm64
            artifact: windows-arm64
            files: |
              out/*.exe
              out/*.exe.blockmap
              out/arm64.yml
          - os: macos-latest
            script: build-m-arm64
            artifact: macos-arm64
            files: |
              out/*.dmg
              out/*.dmg.blockmap
              out/*.zip
              out/*.zip.blockmap
              out/latest-mac.yml
          - os: ubuntu-latest
            script: build-l
            artifact: linux-x64
            files: |
              out/*.deb
              out/latest-linux.yml
          # Linux arm64 deb：在 x64 的 ubuntu-latest 上用 fpm 交叉打包（应用已预编译，fpm 只写 arm64 元数据，不执行目标架构代码）。
          # electron-builder 与 electron-updater 都内置按架构加后缀：产物 latest-linux-arm64.yml，arm64 用户自动读取它，无需自定义 channel
          - os: ubuntu-latest
            script: build-l-arm64
            artifact: linux-arm64
            files: |
              out/*.deb
              out/latest-linux-arm64.yml
    runs-on: ${{ matrix.os }}
    env:
      # 未配置签名证书：关闭 macOS 自动查找签名身份，产物为未签名包
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: frontend
      - name: Build frontend + main process
        run: npm run build
      - name: Package installer
        run: npm run ${{ matrix.script }}
      - uses: actions/upload-artifact@v7
        with:
          name: DataMaskit-${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          # 只收安装包产物：docker/build-push-action 会额外上传 *.dockerbuild 构建记录，不应进 Release
          pattern: DataMaskit-*
          merge-multiple: true
      - name: Zip browser extension
        run: |
          cd extension
          zip -r "../dist/DataMaskit-extension-${GITHUB_REF_NAME}.zip" .
      - name: Zip skill bundle
        run: |
          cd agent-bundle
          zip -r "../dist/maskit-placeholders-${GITHUB_REF_NAME}.zip" maskit-placeholders/SKILL.md maskit-placeholders/README.md maskit-placeholders/README_EN.md maskit-placeholders/templates/AGENTS.snippet.md
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true

  docker:
    # 无头镜像（网关 + 扩展桥接 + Web 面板），仅在打 tag 或手动触发时发布
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/wangneal369/maskit-node
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
